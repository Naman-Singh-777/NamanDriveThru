name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_aws: ${{ steps.check.outputs.has_aws }}
    steps:
      - id: check
        run: echo "has_aws=${{ secrets.AWS_ACCESS_KEY_ID != '' }}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/generate-music-manifest.mjs
      - run: npx tsc -b
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Optional second target: AWS S3 (static website hosting), matching the
  # "AWS S3" skill on the resume. Stays dormant until AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY / AWS_S3_BUCKET are added as repo secrets
  # (Settings -> Secrets and variables -> Actions). Until then this job
  # is skipped automatically -- it never fails the pipeline.
  deploy-s3:
    needs: [build, check-secrets]
    runs-on: ubuntu-latest
    if: ${{ needs.check-secrets.outputs.has_aws == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/generate-music-manifest.mjs
      - run: npx tsc -b
      - run: npx vite build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - run: aws s3 sync dist "s3://${{ secrets.AWS_S3_BUCKET }}" --delete
