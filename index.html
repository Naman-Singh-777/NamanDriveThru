<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Naman Singh — Interactive 3D Driving Portfolio</title>
  <meta name="description" content="Drive a 3D car through an interactive Three.js + Rapier physics world to explore Naman Singh's projects, music and socials. Built with TypeScript, Three.js, Vite and Blender." />
  <meta name="author" content="Naman Singh" />
  <link rel="canonical" href="https://naman-singh-777.github.io/Portfolio-Websiteeeee/" />

  <!-- WEB-PHASE-4 REDO Phase 12 (perf): kicks off the 3D environment's one
       big download (environment.glb) the moment the HTML head is parsed, in
       parallel with fetching/parsing the JS bundle -- instead of waiting for
       JS to finish loading and running before GLTFLoader.load() even starts
       the fetch. Same file, same bytes, same loader code; this just starts
       the network request earlier. "crossorigin" is required on an
       as="fetch" preload (even same-origin) so the browser's GLTFLoader
       fetch() call later reuses this exact response instead of re-fetching
       it -- GLTFLoader's underlying FileLoader calls fetch() with its
       default mode ('cors') and credentials 'same-origin', which is what
       crossorigin="anonymous" here matches. -->
  <link rel="preload" href="assets/environment.glb" as="fetch" crossorigin="anonymous" fetchpriority="high" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Naman Singh — Interactive 3D Driving Portfolio" />
  <meta property="og:description" content="Drive a 3D car through an interactive world built with Three.js and Rapier physics to explore my projects, music and socials." />
  <meta property="og:url" content="https://naman-singh-777.github.io/Portfolio-Websiteeeee/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Naman Singh — Interactive 3D Driving Portfolio" />
  <meta name="twitter:description" content="Drive a 3D car through an interactive world built with Three.js and Rapier physics to explore my projects, music and socials." />

  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; height: 100%; overscroll-behavior: none; }
    #app { width: 100vw; height: 100vh; display: block; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; background: #05070d; color: #cfe0ff;
      font-family: system-ui, sans-serif; z-index: 10;
    }
    #loading .bar { width: 260px; height: 4px; background: #1a2236; border-radius: 2px; overflow: hidden; }
    #loading .fill { height: 100%; width: 0%; background: #6fb8ff; transition: width 0.15s ease; }
    #error {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #1a0808; color: #ffb4b4; font-family: monospace; font-size: 14px;
      padding: 24px; text-align: center; z-index: 20; white-space: pre-wrap;
    }

    /* Smaller/short viewports (phones, esp. landscape with little vertical
       room): shrink the loading UI proportionally instead of it dominating
       the screen. */
    @media (max-width: 760px), (max-height: 500px) {
      #loading { font-size: 14px; gap: 8px; }
      #loading .bar { width: 46vw; max-width: 220px; min-width: 120px; }
    }

    /* On-screen touch controls: a colourless/translucent D-pad (accelerate,
       reverse, steer) plus a separate brake button, bound in
       src/vehicle/touchControls.ts. Hidden entirely on mouse/trackpad devices
       -- only shown for coarse (touch) pointers, i.e. phones/tablets.
       WEB-PHASE-4 REDO Phase 7: the `html[data-input-mode]` rules below (set
       live by touchControls.ts the instant a real touch or keyboard/mouse
       interaction happens) override the media-query guess below them -- this
       is what lets a convertible/2-in-1 laptop switch control schemes on its
       own mid-session, without a reload, in either direction. */
    #touch-controls {
      position: fixed; inset: 0; z-index: 15;
      display: none; /* overridden to flex/contents under (pointer: coarse) below */
      pointer-events: none;
    }
    .touch-btn {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.80);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .touch-btn:active { background: rgba(255, 255, 255, 0.28); }

    /* Left side: forward/reverse only, stacked vertically. */
    #pedals {
      position: absolute;
      left: max(18px, 2.5vw);
      bottom: max(18px, 3vh);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vmin, 16px);
    }
    #pedals .touch-btn {
      width: clamp(66px, 15vmin, 98px);
      height: clamp(66px, 15vmin, 98px);
      border-radius: 16px;
      font-size: clamp(22px, 5.5vmin, 32px);
    }

    /* Right side: steer left -- brake -- steer right, in one row so brake
       sits directly between the two steering buttons. */
    #steer {
      position: absolute;
      right: max(18px, 2.5vw);
      bottom: max(18px, 3vh);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(10px, 2vmin, 16px);
    }
    #touch-btn-left, #touch-btn-right {
      width: clamp(66px, 15vmin, 98px);
      height: clamp(66px, 15vmin, 98px);
      border-radius: 16px;
      font-size: clamp(22px, 5.5vmin, 32px);
    }
    #touch-btn-brake {
      width: clamp(74px, 16.5vmin, 106px);
      height: clamp(74px, 16.5vmin, 106px);
      border-radius: 50%;
      border-width: 2px;
      font: 700 clamp(12px, 2.6vmin, 15px) / 1 system-ui, sans-serif;
      letter-spacing: 0.06em;
    }

    /* WEB-PHASE-4 REDO Phase 13: both "show touch controls" rules below also
       require html.is-ready, a class main.ts adds only once loading finishes
       and the vehicle is actually drivable (previously the D-pad could
       appear immediately on a touch device while "Loading environment..."
       was still on screen). html[data-input-mode="pointer"] below is
       unaffected -- it only ever hides, never shows. */
    @media (pointer: coarse) {
      html.is-ready #touch-controls { display: block; }
    }
    /* Higher specificity than the plain #touch-controls rule above (and than
       the media-query version, since specificity doesn't care which rule is
       inside a media block) -- wins once JS has observed a real interaction. */
    html.is-ready[data-input-mode="touch"] #touch-controls { display: block; }
    html[data-input-mode="pointer"] #touch-controls { display: none; }

    /* WEB-PHASE-4 REDO Phase 10: touch/phone devices have no Enter key, so
       the "OPEN <Enter>" checkpoint prompt itself must be tappable there --
       same data-input-mode pattern as #touch-controls above (coarse-pointer
       media query for the pre-interaction guess, then the live attribute
       once a real touch/keyboard/mouse event is observed). On keyboard+mouse
       devices this stays pointer-events:none exactly as before, so nothing
       about the desktop ENTER flow changes. */
    @media (pointer: coarse) {
      .checkpoint-prompt { pointer-events: auto; cursor: pointer; }
    }
    html[data-input-mode="touch"] .checkpoint-prompt { pointer-events: auto; cursor: pointer; }
    html[data-input-mode="pointer"] .checkpoint-prompt { pointer-events: none; }

    /* Guaranteed landscape fallback: true orientation-locking (attempted in
       touchControls.ts) only works on some Android browsers and never on iOS
       Safari, so a touch device left in portrait gets a blocking prompt
       instead of a cramped/unplayable layout. */
    #rotate-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      background: #05070d; color: rgba(255, 255, 255, 0.85);
      font-family: system-ui, sans-serif; text-align: center; padding: 24px;
    }
    #rotate-overlay .icon { font-size: 44px; }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }

    /* WEB-PHASE-4: checkpoint "OPEN <Enter>" prompt -- a small screen-space
       label positioned every frame (src/vehicle/checkpoint.ts) above whichever
       world-space checkpoint pad the car is currently inside. Restrained,
       not a big HUD element: a thin glass pill, quiet by default, that only
       brightens on hover-adjacent proximity (it's only ever shown while
       active at all). */
    .checkpoint-prompt {
      position: fixed; left: 0; top: 0; z-index: 12;
      display: none; align-items: center; gap: 7px;
      padding: 7px 14px 7px 16px;
      border-radius: 999px;
      background: rgba(12, 18, 30, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      color: rgba(255, 255, 255, 0.92);
      font: 600 12.5px/1 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(130, 180, 255, 0.18);
      animation: checkpoint-prompt-breathe 2.6s ease-in-out infinite;
    }
    .checkpoint-prompt__enter { display: flex; color: rgba(255, 255, 255, 0.85); }
    @keyframes checkpoint-prompt-breathe {
      0%, 100% { box-shadow: 0 0 14px rgba(130, 180, 255, 0.14); }
      50% { box-shadow: 0 0 22px rgba(130, 180, 255, 0.30); }
    }

    /* WEB-PHASE-4: shared full-screen glass overlay the three checkpoints
       open into (src/overlay.ts). Frosted/translucent -- the 3D scene behind
       it keeps rendering and stays visible, dimmed and blurred, never fully
       hidden. Not a generic opaque HTML modal. */
    #checkpoint-overlay {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; visibility: hidden;
      transition: opacity 0.28s ease;
      background: rgba(5, 8, 14, 0.46);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
    }
    #checkpoint-overlay.is-open { opacity: 1; visibility: visible; }
    #checkpoint-overlay-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: min(640px, 86vh);
      display: flex; flex-direction: column;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      padding: 30px 30px 24px;
      color: rgba(255, 255, 255, 0.94);
      font-family: system-ui, sans-serif;
      transform: translateY(8px);
      transition: transform 0.28s ease;
    }
    #checkpoint-overlay.is-open #checkpoint-overlay-panel { transform: translateY(0); }
    /* WEB-PHASE-4 REDO Phase 9: while a checkpoint's menu is open, the main
       driving-scene canvas (not the glass panel) is inverted (see
       requestOpenOverlay/requestCloseOverlay in overlay.ts) -- "a parallel
       inverted universe" after the light-speed jump: car, sky, ocean,
       everything the canvas renders. #checkpoint-overlay's own
       backdrop-filter blur sits on top of #app in the stacking order, so the
       blurred glass backdrop automatically shows this inverted scene while
       the panel itself (and its text) stays normal and directly legible, with
       no separate transition -- the swap happens while the light-speed
       overlay (z-index 50, above both) is still opaque, so nothing
       uninverted is ever visible in between. hue-rotate(180deg) alongside
       invert(1) keeps it reading as a coherent flipped palette rather than a
       harsh raw negative. */
    #app.is-inverted { filter: invert(1) hue-rotate(180deg); }
    .checkpoint-overlay__close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.85);
      font-size: 18px; line-height: 1;
      cursor: pointer;
    }
    .checkpoint-overlay__close:hover { background: rgba(255, 255, 255, 0.16); }
    /* WEB-PHASE-4 REDO Phase 13: title + the GitHub avatar badge share one
       row, badge pinned to the far right of the "PROJECTS" heading itself
       (not floating up by the close button) -- shown only while the Port
       overlay specifically is open (row gets .is-port in overlay.ts's
       openOverlay/closeOverlay). */
    .checkpoint-overlay__title-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin: 0 0 18px;
    }
    .checkpoint-overlay__title {
      margin: 0; font-size: 13px; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }
    /* WEB-PHASE-4 REDO Phase 16: swapped with the GitHub avatar badge below
       (now in the "Projects" heading) -- the globe/site-link badge lives in
       the title row instead, still Port-only via .is-port. Extra
       margin-right keeps it clear of the body's scrollbar column beneath. */
    .checkpoint-overlay__site-badge {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.22);
      margin-right: 8px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .checkpoint-overlay__title-row.is-port .checkpoint-overlay__site-badge { display: flex; }
    .checkpoint-overlay__site-badge:hover { color: #9cc4ff; border-color: rgba(156, 196, 255, 0.5); }
    .checkpoint-overlay__site-badge svg { width: 16px; height: 16px; }
    .checkpoint-overlay__body { overflow-y: auto; flex: 1; }
    .checkpoint-overlay__empty { color: rgba(255, 255, 255, 0.55); font-size: 14px; margin: 8px 0; }
    .checkpoint-overlay__menu, .checkpoint-overlay__social { list-style: none; margin: 0; padding: 0; }
    .checkpoint-overlay__menu li, .checkpoint-overlay__social li {
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      padding: 14px 2px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .checkpoint-overlay__menu li:first-child, .checkpoint-overlay__social li:first-child { border-top: none; }
    .checkpoint-overlay__menu a, .checkpoint-overlay__social a, .checkpoint-overlay__copy-btn {
      color: rgba(255, 255, 255, 0.95); text-decoration: none;
      font-size: 16px; font-weight: 600; letter-spacing: 0.01em;
      display: inline-flex; align-items: center; gap: 8px;
    }
    /* WEB-PHASE-4 REDO Phase 15: Connect's email entries copy to clipboard
       instead of opening a mailto: link -- same row look as the anchor
       entries, reset from the default <button> chrome. */
    .checkpoint-overlay__copy-btn {
      background: none; border: none; padding: 0; margin: 0;
      font-family: inherit; cursor: pointer; text-align: left;
    }
    /* WEB-PHASE-4 REDO Phase 7: small per-app icon in front of every anchor's
       text except Spotify's (see overlay.ts icon()). */
    .checkpoint-overlay__icon { flex-shrink: 0; }
    .checkpoint-overlay__menu a:hover, .checkpoint-overlay__social a:hover,
    .checkpoint-overlay__copy-btn:hover { color: #9cc4ff; }
    .checkpoint-overlay__desc { color: rgba(255, 255, 255, 0.5); font-size: 13px; }
    .checkpoint-overlay__section-heading {
      margin: 0 0 10px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }
    .checkpoint-overlay__section-heading:not(:first-child) { margin-top: 20px; }
    /* WEB-PHASE-4 REDO Phase 14: a small icon linking out to the live
       portfolio site itself, pinned to the far right of the "Projects"
       heading (Port only) -- separate from the GitHub profile avatar up in
       the title row above. */
    .checkpoint-overlay__section-heading--with-badge {
      display: flex; align-items: center; justify-content: space-between;
    }
    /* WEB-PHASE-4 REDO Phase 16: swapped with the globe/site badge above
       (now in the title row) -- the GitHub avatar lives here instead, sized
       up slightly (26px -> 30px) now that it has the row to itself, with
       extra margin-right to clear the body's own scrollbar column. */
    .checkpoint-overlay__github-badge {
      flex-shrink: 0;
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden; margin-right: 8px;
    }
    .checkpoint-overlay__github-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* WEB-PHASE-4 REDO Phase 6: Platform's "menu of albums/playlists" grid.
       WEB-PHASE-4 REDO Phase 11: cover art now comes from the cover image
       file inside each local public/assets/music/<folder>/ (musicPlayer.ts),
       not Spotify's oEmbed endpoint -- same grid markup/classes, just fed by
       local data. Click one -> its player replaces this grid (see
       .checkpoint-overlay__back-link / __player below). */
    .checkpoint-overlay__spotify-menu {
      list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
    }
    .checkpoint-overlay__spotify-card {
      cursor: pointer; display: flex; flex-direction: column; gap: 8px;
      border-radius: 10px; padding: 8px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }
    .checkpoint-overlay__spotify-card:hover, .checkpoint-overlay__spotify-card:focus-visible {
      background: rgba(255, 255, 255, 0.09); border-color: rgba(156, 196, 255, 0.4);
      transform: translateY(-2px); outline: none;
    }
    .checkpoint-overlay__spotify-cover {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 7px;
      background-color: rgba(255, 255, 255, 0.08);
      background-size: cover; background-position: center;
    }
    .checkpoint-overlay__spotify-title {
      font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
      line-height: 1.3;
    }
    .checkpoint-overlay__back-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; padding: 0 0 14px;
      color: rgba(255, 255, 255, 0.6); font-size: 13px; font-weight: 600;
      font-family: inherit;
    }
    .checkpoint-overlay__back-link:hover { color: #9cc4ff; }

    /* WEB-PHASE-4 REDO Phase 11: self-hosted player UI (replaces the old
       Spotify iframe) -- same dark-glass aesthetic as the rest of the panel.
       The <audio> element itself is owned/appended by src/vehicle/
       musicPlayer.ts directly to document.body, outside this markup, so it
       is never destroyed when bodyEl is cleared on back/close. */
    .checkpoint-overlay__player {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 10px; padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10); margin-bottom: 14px;
    }
    .checkpoint-overlay__player-cover {
      width: 148px; height: 148px; border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.08);
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.35);
    }
    .checkpoint-overlay__player-title {
      font-size: 15px; font-weight: 700; color: rgba(255, 255, 255, 0.95);
      line-height: 1.3;
    }
    .checkpoint-overlay__transport {
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    .checkpoint-overlay__transport-btn {
      background: none; border: none; cursor: pointer; padding: 6px;
      color: rgba(255, 255, 255, 0.75); display: flex; border-radius: 50%;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .checkpoint-overlay__transport-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .checkpoint-overlay__transport-btn--play {
      color: #fff; background: rgba(255, 255, 255, 0.14);
      width: 44px; height: 44px; align-items: center; justify-content: center;
    }
    .checkpoint-overlay__transport-btn--play:hover { background: rgba(255, 255, 255, 0.22); }
    .checkpoint-overlay__scrub-row {
      display: flex; align-items: center; gap: 8px; width: 100%;
    }
    .checkpoint-overlay__time {
      font-size: 11px; color: rgba(255, 255, 255, 0.5); min-width: 32px;
      font-variant-numeric: tabular-nums;
    }
    .checkpoint-overlay__scrubber {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.18);
      outline: none; cursor: pointer;
    }
    .checkpoint-overlay__scrubber::-webkit-slider-thumb {
      -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
      background: #9cc4ff; cursor: pointer;
    }
    .checkpoint-overlay__scrubber::-moz-range-thumb {
      width: 11px; height: 11px; border-radius: 50%; border: none;
      background: #9cc4ff; cursor: pointer;
    }
    .checkpoint-overlay__nocover-icon { opacity: 0.6; }
    .checkpoint-overlay__tracklist { list-style: none; margin: 0; padding: 0; }
    .checkpoint-overlay__track {
      display: flex; align-items: center; gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 4px; cursor: pointer; border-radius: 6px;
    }
    .checkpoint-overlay__track:first-child { border-top: none; }
    .checkpoint-overlay__track:hover { background: rgba(255, 255, 255, 0.05); }
    .checkpoint-overlay__track.is-playing { background: rgba(156, 196, 255, 0.10); }
    .checkpoint-overlay__track.is-playing .checkpoint-overlay__track-title { color: #9cc4ff; }
    .checkpoint-overlay__track-num {
      width: 18px; flex-shrink: 0; text-align: right;
      font-size: 12px; color: rgba(255, 255, 255, 0.4);
      font-variant-numeric: tabular-nums;
    }
    .checkpoint-overlay__track-title {
      flex: 1; font-size: 14px; color: rgba(255, 255, 255, 0.9);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .checkpoint-overlay__track-duration {
      font-size: 12px; color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums; flex-shrink: 0;
    }

    @media (max-width: 560px) {
      #checkpoint-overlay-panel { padding: 24px 20px 20px; border-radius: 16px; }
    }

    /* WEB-PHASE-4 REDO Phase 8: full-screen "light speed" transition, played
       by src/vehicle/lightspeed.ts right before a checkpoint overlay actually
       opens and again right before it actually closes -- a real Three.js
       warp-tunnel scene (streaks + a wide-FOV camera) built from the user's
       own Blender tutorial reference, rendered into a canvas this div holds.
       This div itself just cross-fades in/out around that canvas; z-index
       sits above the checkpoint overlay (30) so it fully covers the cut in
       both directions. */
    #lightspeed-overlay {
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    #lightspeed-overlay.is-active { opacity: 1; }

    /* WEB-PHASE-4 REDO Phase 13: Steam-style "Achievement Unlocked" toast,
       fired once per checkpoint on its genuine first visit (see
       registerVisit() in src/vehicle/achievements.ts, called from
       activateCheckpoint() in main.ts). z-index above both the checkpoint
       overlay and the light-speed canvas so it's never hidden behind either
       while the unlock happens. */
    #achievement-toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 70;
      display: none; align-items: center; gap: 12px;
      background: linear-gradient(165deg, #1b2534, #0d1420);
      border: 1px solid rgba(255, 196, 77, 0.45);
      border-radius: 10px;
      padding: 12px 18px 12px 14px;
      max-width: min(320px, calc(100vw - 36px));
      color: #e8edf5;
      font-family: system-ui, sans-serif;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transform: translateY(16px) scale(0.97);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
    }
    #achievement-toast.is-visible { transform: translateY(0) scale(1); opacity: 1; }
    .achievement-toast__icon {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 7px;
      background: linear-gradient(160deg, #ffd977, #c98a1f);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .achievement-toast__label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: #ffc44d; margin: 0 0 3px;
    }
    .achievement-toast__title { font-size: 14px; font-weight: 700; margin: 0 0 2px; line-height: 1.25; }
    .achievement-toast__subtitle { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin: 0; line-height: 1.3; }

    /* Separate, shorter-lived popup explaining the key just unlocked --
       always exactly 3s on screen per spec, top-center so it never overlaps
       the achievement toast's bottom-right corner or the touch D-pad. */
    /* WEB-PHASE-4 REDO Phase 13: fires 2s after the checkpoint menu
       actually closes (see notifyOverlayClosed() in achievements.ts), dead
       center, holds 2s, then "poofs" -- a quick scale-up + fade distinct
       from its gentler scale-in entrance. */
    #key-unlock-popup {
      position: fixed; top: 50%; left: 50%; z-index: 70;
      display: none;
      transform: translate(-50%, -50%) scale(0.85);
      background: rgba(10, 16, 26, 0.86);
      border: 1px solid rgba(156, 196, 255, 0.35);
      border-radius: 999px;
      padding: 11px 24px;
      color: #cfe0ff;
      font: 600 14px/1.3 system-ui, sans-serif;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.25s cubic-bezier(.2,.8,.2,1), opacity 0.25s ease;
    }
    #key-unlock-popup.is-visible { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    /* Pill chrome dissolves to transparent while the letters (below) smoke
       off independently -- the box doesn't move or scale, only fades. */
    #key-unlock-popup.is-poofing {
      transition: background 0.5s ease 0.2s, border-color 0.5s ease 0.2s,
                  box-shadow 0.5s ease 0.2s, backdrop-filter 0.5s ease 0.2s;
      background: rgba(10, 16, 26, 0);
      border-color: rgba(156, 196, 255, 0);
      box-shadow: none;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }
    #key-unlock-popup-text span {
      display: inline-block;
      will-change: transform, opacity, filter;
    }
    #key-unlock-popup.is-poofing #key-unlock-popup-text span {
      animation: key-popup-smoke-out 0.6s forwards ease-in-out;
    }
    @keyframes key-popup-smoke-out {
      0% { transform: rotate(0deg) translate(0, 0) scale(1); opacity: 1; filter: blur(0px); }
      50% { filter: blur(5px); }
      100% { transform: rotate(32deg) translate(9px, -30px) scale(1.7); opacity: 0; filter: blur(11px); }
    }

    @media (max-width: 480px) {
      #key-unlock-popup { white-space: normal; text-align: center; max-width: calc(100vw - 48px); }
    }

    /* WEB-PHASE-4 REDO Phase 13: touch-only equivalent of the M/G/C keyboard
       shortcuts (phones have no keyboard) -- small pulsing badge chips,
       hidden until html.is-ready (same loading gate as #touch-controls) and
       individually hidden again until that specific checkpoint has actually
       been visited once (see .is-unlocked, toggled by achievements.ts).
       Stacked top-right, clear of the pedals/steer D-pad which live at the
       bottom corners. */
    #shortcut-chips {
      position: fixed; top: max(14px, 2vh); right: max(14px, 2.5vw); z-index: 16;
      display: none;
      flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    html.is-ready[data-input-mode="touch"] #shortcut-chips { display: flex; }
    .shortcut-chip {
      width: 40px; height: 40px; border-radius: 50%;
      display: none;
      align-items: center; justify-content: center;
      font: 700 15px/1 system-ui, sans-serif;
      color: #0a0f18;
      border: 2px solid rgba(255, 255, 255, 0.55);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      animation: shortcut-chip-pulse 2.4s ease-in-out infinite;
    }
    .shortcut-chip.is-unlocked { display: flex; pointer-events: auto; }
    #shortcut-chip-platform { background: #7fe3b4; }
    #shortcut-chip-port { background: #6fb8ff; }
    #shortcut-chip-city { background: #ffc477; }
    @keyframes shortcut-chip-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.28); }
      50% { box-shadow: 0 0 0 7px rgba(255, 255, 255, 0); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>Loading environment&hellip;</div>
    <div class="bar"><div class="fill" id="loading-fill"></div></div>
  </div>
  <div id="error"></div>
  <canvas id="app"></canvas>

  <div id="touch-controls">
    <div id="pedals">
      <div id="touch-btn-up" class="touch-btn" aria-label="Accelerate">&#9650;</div>
      <div id="touch-btn-down" class="touch-btn" aria-label="Reverse">&#9660;</div>
    </div>
    <div id="steer">
      <div id="touch-btn-left" class="touch-btn" aria-label="Steer left">&#9664;</div>
      <div id="touch-btn-brake" class="touch-btn" aria-label="Brake">BRAKE</div>
      <div id="touch-btn-right" class="touch-btn" aria-label="Steer right">&#9654;</div>
    </div>
  </div>

  <div id="rotate-overlay">
    <div class="icon">&#8635;</div>
    <div>Rotate your device to landscape<br />for the best driving experience</div>
  </div>

  <!-- WEB-PHASE-4: shared checkpoint overlay shell -- src/overlay.ts fills
       #checkpoint-overlay-body per checkpoint; the floating "OPEN <Enter>"
       prompts are created/positioned by src/vehicle/checkpoint.ts and need
       no static markup here. -->
  <div id="checkpoint-overlay" aria-hidden="true">
    <div id="checkpoint-overlay-panel" role="dialog" aria-modal="true" aria-labelledby="checkpoint-overlay-title">
      <button id="checkpoint-overlay-close" aria-label="Close" type="button">&times;</button>
      <div id="checkpoint-overlay-title-row" class="checkpoint-overlay__title-row">
        <h2 id="checkpoint-overlay-title" class="checkpoint-overlay__title"></h2>
        <a id="checkpoint-overlay-site" class="checkpoint-overlay__site-badge" target="_blank" rel="noopener noreferrer" aria-label="Open this portfolio website"></a>
      </div>
      <div id="checkpoint-overlay-body" class="checkpoint-overlay__body"></div>
    </div>
  </div>

  <!-- WEB-PHASE-4 REDO Phase 8: full-screen canvas the "light speed" warp
       transition renders into right before a checkpoint overlay opens/closes
       -- see src/vehicle/lightspeed.ts. (Music now plays via a persistent
       <audio> element musicPlayer.ts appends straight to document.body, so
       no separate off-screen holder element is needed here any more.) -->
  <div id="lightspeed-overlay" aria-hidden="true"></div>

  <!-- WEB-PHASE-4 REDO Phase 13: Steam-style achievement toast + key-unlock
       popup + touch-only shortcut chips -- see src/vehicle/achievements.ts,
       the sole module that fills/toggles these. -->
  <div id="achievement-toast" role="status" aria-live="polite">
    <div class="achievement-toast__icon">&#9733;</div>
    <div>
      <p class="achievement-toast__label">Achievement Unlocked</p>
      <p class="achievement-toast__title" id="achievement-toast-title"></p>
      <p class="achievement-toast__subtitle" id="achievement-toast-subtitle"></p>
    </div>
  </div>
  <div id="key-unlock-popup" role="status" aria-live="polite">
    <span id="key-unlock-popup-text"></span>
  </div>
  <div id="shortcut-chips">
    <div id="shortcut-chip-platform" class="shortcut-chip" role="button" aria-label="Reopen Music">M</div>
    <div id="shortcut-chip-port" class="shortcut-chip" role="button" aria-label="Reopen Projects">G</div>
    <div id="shortcut-chip-city" class="shortcut-chip" role="button" aria-label="Reopen Connect">C</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
